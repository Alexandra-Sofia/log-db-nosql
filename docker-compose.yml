services:
  mongo:
    image: mongo:7
    container_name: nosql_logs_mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: nosql_logs
    volumes:
      - mongo_data:/data/db

  api:
    build: ./api
    container_name: nosql_logs_api
    environment:
      MONGO_URI: "mongodb://mongo:27017"
      MONGO_DB: "nosql_logs"
    ports:
      - "8000:8000"
    depends_on:
      - mongo

  ingest:
    build: ./ingest
    container_name: nosql_logs_ingest
    environment:
      MONGO_URI: "mongodb://mongo:27017"
      MONGO_DB: "nosql_logs"
    depends_on:
      - mongo
    volumes:
      - ./input_logs:/input_logs:ro
    command:
      [
        "python",
        "mongo_ingest.py",
        "--mongo-uri",
        "mongodb://mongo:27017",
        "--mongo-db",
        "nosql_logs",
        "--collection",
        "logs",
        "--batch-size",
        "5000",
        "--access",
        "/input_logs/access_log_full",
        "--datax",
        "/input_logs/HDFS_DataXceiver.log",
        "--namesys",
        "/input_logs/HDFS_FS_Namesystem.log"
      ]
    restart: "no"


volumes:
  mongo_data:
  ingest_work:
