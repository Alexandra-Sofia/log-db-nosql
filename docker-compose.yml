services:
  mongo:
    image: mongo:7
    container_name: mongo_db
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: nosql_logs
    volumes:
      - mongo_data:/data/db

#  api:
#    build: ./api
#    container_name: logdb_api
#    environment:
#      MONGO_URI: "mongodb://mongo:27017"
#      MONGO_DB: "nosql_logs"
#    ports:
#      - "8000:8000"
#    depends_on:
#      - mongo

  ingest:
    build:
      context: ./ingest
      dockerfile: Dockerfile
    container_name: logdb_ingest
    environment:
      MONGO_URI: "mongodb://mongo:27017"
      MONGO_DB: "nosql_logs"
      MONGO_COLLECTION: "logs"
      LOG_DIR: "/input-logfiles"
    depends_on:
      - mongo
    volumes:
      - ./input-logfiles:/input-logfiles:ro
    restart: "no"
    command: >
      bash -c '
        ts() { date "+%Y-%m-%d %H:%M:%S.%3N"; }
        echo "$(ts) | Ingest step deployment: START." &&
        python execute.py &&
        echo "$(ts) | Ingest step deployment: END."
      '

volumes:
  mongo_data:
